<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>PII Detection Transformers.js Demo</title>
  <script type="module">
    import { pipeline, AutoTokenizer } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

    let classifier = null;
    let tokenizer = null;
    let benchmark_data = null;
    let currentModel = null;

    const MODEL_CONFIGS = {
      'piiranha-v1': {
        modelId: 'pavidu/piiranha-v1-detect-personal-information-onnx',
        useAggregation: false,
        // All dtypes work on wasm for this model
        wasmIncompatibleDtypes: [],
        recommendedDevice: 'wasm',
        recommendedDtype: 'q4f16',
      },
      'oai-privacy-filter': {
        modelId: 'openai/privacy-filter',
        useAggregation: true,
        // Quantized variants use GatherBlockQuantized which is not supported by WASM backend
        wasmIncompatibleDtypes: ['q4', 'q4f16', 'q8', 'int8', 'uint8', 'bnb4'],
        recommendedDevice: 'webgpu',
        recommendedDtype: 'q4f16',
      },
    };

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function updateText(text) {
      document.getElementById('output').innerText = text;
    }

    function checkWebGPUSupport() {
      return !!navigator.gpu;
    }

    function updateDeviceOptions() {
      const webgpuOption = document.querySelector('#device-select option[value="webgpu"]');
      if (checkWebGPUSupport()) {
        webgpuOption.disabled = false;
      } else {
        webgpuOption.disabled = true;
        webgpuOption.textContent = 'webgpu (not available)';
      }
    }

    function applyModelDefaults() {
      const modelKey = document.getElementById('model-select').value;
      const config = MODEL_CONFIGS[modelKey];
      const deviceSelect = document.getElementById('device-select');
      const dtypeSelect = document.getElementById('dtype-select');

      // Set recommended device (fall back to wasm if webgpu not available)
      if (config.recommendedDevice === 'webgpu' && checkWebGPUSupport()) {
        deviceSelect.value = 'webgpu';
      } else {
        deviceSelect.value = 'wasm';
      }
      dtypeSelect.value = config.recommendedDtype;
      updateCompatibilityWarning();
    }

    function updateCompatibilityWarning() {
      const modelKey = document.getElementById('model-select').value;
      const device = document.getElementById('device-select').value;
      const dtype = document.getElementById('dtype-select').value;
      const config = MODEL_CONFIGS[modelKey];
      const warning = document.getElementById('compat-warning');

      if (device === 'wasm' && config.wasmIncompatibleDtypes.includes(dtype)) {
        warning.textContent = `⚠️ "${modelKey}" with dtype="${dtype}" requires WebGPU. The WASM backend does not support the GatherBlockQuantized operator used by quantized variants of this model. Switch to WebGPU or use fp32/fp16.`;
        warning.style.display = 'block';
      } else {
        warning.style.display = 'none';
      }
    }

    async function loadModel() {
      const device = document.getElementById('device-select').value;
      const dtype = document.getElementById('dtype-select').value;
      const modelKey = document.getElementById('model-select').value;
      const config = MODEL_CONFIGS[modelKey];

      if (device === 'wasm' && config.wasmIncompatibleDtypes.includes(dtype)) {
        updateText(`Cannot load "${modelKey}" with dtype="${dtype}" on WASM. Quantized variants of this model use the GatherBlockQuantized operator which is not supported by the WASM backend. Please switch to WebGPU or use fp32/fp16.`);
        return;
      }

      updateText("Loading model...");

      try {
        const startTime = performance.now();
        const pipelineOptions = {
          progress_callback: (p) => {
            const progress = p.progress ? `${Math.round(p.progress)}%` : "";
            document.getElementById('output').innerText = `Status: ${p.status} ${progress}`;
          },
          device: device,
          dtype: dtype,
        };

        classifier = await pipeline(
          'token-classification',
          config.modelId,
          pipelineOptions
        );
        tokenizer = await AutoTokenizer.from_pretrained(config.modelId);
        currentModel = modelKey;
        const endTime = performance.now();
        updateText(`Model "${modelKey}" ready after ${Math.round((endTime - startTime) / 10) / 100} sec. Enter text and press Enter.`);
      } catch (e) {
        updateText(`Exception occurred. Please make sure your environment supports ${device} and ${dtype}.\n${e}`);
        classifier = null;
        tokenizer = null;
        currentModel = null;
      }
    }

    function mergeTokensPiiranha(result) {
      const cleaned_result = [];
      let cur_text = "", cur_entity, cur_idx;
      for (let r of result) {
        if (!cur_text || (r.entity == cur_entity && r.index == cur_idx + 1)) {
          cur_text = cur_text + r.word;
          cur_entity = r.entity;
          cur_idx = r.index;
        } else {
          cleaned_result.push({ "text": cur_text.trim(), "entity": cur_entity });
          cur_text = r.word;
          cur_entity = r.entity;
          cur_idx = r.index;
        }
      }
      if (!!cur_text) {
        cleaned_result.push({ "text": cur_text.trim(), "entity": cur_entity });
      }
      return cleaned_result;
    }

    function mergeTokensOAI(result) {
      return result.map(r => ({
        text: r.word.trim(),
        entity: r.entity_group,
      }));
    }

    async function classifyText(text, update = true) {
      if (!classifier) return;

      const config = MODEL_CONFIGS[currentModel];
      const startTime = performance.now();

      let result;
      if (config.useAggregation) {
        result = await classifier(text, { aggregation_strategy: "simple" });
      } else {
        result = await classifier(text);
      }
      const endTime = performance.now();

      let cleaned_result;
      if (config.useAggregation) {
        cleaned_result = mergeTokensOAI(result);
      } else {
        cleaned_result = mergeTokensPiiranha(result);
      }

      if (update) {
        updateText(`(Took ${Math.round((endTime - startTime) / 10) / 100} sec)\n${JSON.stringify(cleaned_result, null, 2)}`);
      }
      return cleaned_result;
    }

    async function loadJSONL(url) {
      let cache = null;
      try {
        const cacheName = 'PII-Detection-Browser-Demo';
        cache = await caches.open(cacheName);
        const cachedResponse = await cache.match(url);
        if (cachedResponse) {
          console.log('Loaded from cache:', url);
          return await cachedResponse.text();
        }
      } catch (e) {
        console.log(`Failed to load cache: ${e}`);
        cache = null;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        if (cache != null) {
          await cache.put(url, response.clone());
        }
        return await response.text();
      } catch (error) {
        console.error('Failed to load JSONL file:', error);
        return null;
      }
    }

    async function runBenchmark() {
      if (benchmark_data == null) {
        updateText("Loading benchmark data");
        benchmark_data = await loadJSONL("https://huggingface.co/datasets/ai4privacy/open-pii-masking-500k-ai4privacy/resolve/main/data/validation/test.jsonl");
        benchmark_data = benchmark_data.trim().split("\n").map(r => JSON.parse(r));
        benchmark_data = benchmark_data.filter(r => r.language != "te" && r.language != "hi");
        benchmark_data = benchmark_data.map(r => ({ "source_text": r.source_text, "privacy_mask": r.privacy_mask.filter(m => !["TIME", "TITLE", "AGE", "SEX"].includes(m.label)) }));
        benchmark_data = benchmark_data.filter(r => r.privacy_mask.length > 0);
      }
      updateText("Starting benchmark");
      const n = 2000;
      const recalls = [];
      const precisions = [];
      const token_counts = [];
      const times = [];
      for (let i = 0; i < n; ++i) {
        const startTime = performance.now();
        const preds = await classifyText(benchmark_data[i].source_text, false);
        const endTime = performance.now();

        const pred_text = preds.map(p => p.text).join(" ");
        const targets = benchmark_data[i].privacy_mask;
        const target_text = targets.map(t => t.value).join(" ");
        for (const target of targets) {
          recalls.push(pred_text.includes(target.value));
        }
        for (const pred of preds) {
          precisions.push(target_text.includes(pred.text));
        }

        const tokens = await tokenizer.encode(benchmark_data[i].source_text);
        token_counts.push(tokens.length);
        times.push(endTime - startTime);
        updateText(`Finished ${i + 1}/${n}`);
        await delay(1);
      }

      const metrics = evaluateMetrics(recalls, precisions);
      const timeMetrics = evaluateTime(times.slice(5), token_counts.slice(5));
      updateText(`Test results: ${JSON.stringify(metrics)}\nTime results: ${JSON.stringify(timeMetrics)}`);
    }

    function evaluateMetrics(recalls, precisions) {
      const num_targets = recalls.length;
      const num_preds = precisions.length;
      const recall = recalls.reduce((a, b) => a + b, 0) / num_targets;
      const precision = precisions.reduce((a, b) => a + b, 0) / num_preds;
      return { num_targets, num_preds, precision, recall };
    }

    function evaluateTime(times, token_counts) {
      const n = times.length;
      // Convert ms to seconds
      const times_sec = times.map(t => t / 1000);

      const mean = times_sec.reduce((sum, val) => sum + val, 0) / n;
      const variance = times_sec.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / n;
      const stdDev = Math.sqrt(variance);
      const sorted = [...times_sec].sort((a, b) => a - b);
      const mid = Math.floor(n / 2);
      const median = n % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];

      // Tokens per second (token_count / time_in_seconds)
      const tokens_per_sec = times_sec.map((t, i) => token_counts[i] / t);
      const mean_tokens_per_sec = tokens_per_sec.reduce((sum, val) => sum + val, 0) / n;
      const variance_tokens_per_sec = tokens_per_sec.reduce((sum, val) => sum + Math.pow(val - mean_tokens_per_sec, 2), 0) / n;
      const stdDev_tokens_per_sec = Math.sqrt(variance_tokens_per_sec);
      const sorted_tokens_per_sec = [...tokens_per_sec].sort((a, b) => a - b);
      const mid_tps = Math.floor(n / 2);
      const median_tokens_per_sec = n % 2 === 0 ? (sorted_tokens_per_sec[mid_tps - 1] + sorted_tokens_per_sec[mid_tps]) / 2 : sorted_tokens_per_sec[mid_tps];

      return {
        mean_time_sec: mean,
        stdDev_time_sec: stdDev,
        median_time_sec: median,
        mean_tokens_per_sec,
        stdDev_tokens_per_sec,
        median_tokens_per_sec,
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateDeviceOptions();
      applyModelDefaults();

      document.getElementById('model-select').addEventListener('change', applyModelDefaults);
      document.getElementById('device-select').addEventListener('change', updateCompatibilityWarning);
      document.getElementById('dtype-select').addEventListener('change', updateCompatibilityWarning);

      const input = document.getElementById('text');
      input.addEventListener('keydown', async (event) => {
        if (event.key == "Enter" && !event.shiftKey && input.value.trim()) {
          event.preventDefault();
          if (classifier == null) {
            updateText("No loaded model. Please load a model first.");
            return;
          }
          updateText("Processing...");
          await classifyText(input.value.trim());
        }
      });

      document.getElementById('load-button').addEventListener('click', async () => {
        await loadModel();
      });

      document.getElementById('benchmark-button').addEventListener('click', async () => {
        if (classifier == null) {
          updateText("No loaded model. Please load a model first.");
          return;
        }
        await runBenchmark();
      });
    });
  </script>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
    }

    textarea {
      width: 100%;
      height: 60px;
      font-size: 1em;
      padding: 0.5em;
    }

    pre {
      background: #f0f0f0;
      padding: 1em;
      white-space: pre-wrap;
      margin-top: 1em;
    }

    .controls {
      margin-bottom: 1em;
    }

    #compat-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 0.6em 1em;
      margin-bottom: 1em;
      border-radius: 4px;
      font-size: 0.9em;
    }

    select,
    button {
      font-size: 1em;
      padding: 0.3em;
      margin-right: 0.5em;
    }
  </style>
</head>

<body>
  <h1>PII Detection Transformers.js Demo</h1>
  <div class="controls">
    <label for="model-select">Model:</label>
    <select id="model-select">
      <option value="piiranha-v1" selected>piiranha-v1</option>
      <option value="oai-privacy-filter">oai-privacy-filter</option>
    </select>

    <label for="device-select">Device:</label>
    <select id="device-select">
      <option value="wasm" selected>wasm</option>
      <option value="webgpu">webgpu</option>
    </select>

    <label for="dtype-select">Dtype:</label>
    <select id="dtype-select">
      <option value="fp32">fp32</option>
      <option value="fp16">fp16</option>
      <option value="q8">q8</option>
      <option value="int8">int8</option>
      <option value="uint8">uint8</option>
      <option value="q4">q4</option>
      <option value="bnb4">bnb4</option>
      <option value="q4f16" selected>q4f16</option>
    </select>

    <button id="load-button">Load Model</button>

    <button id="benchmark-button">Start benchmark</button>
  </div>

  <div id="compat-warning" style="display:none;"></div>

  <textarea id="text" placeholder="Type text and press Enter..."></textarea>
  <pre id="output">Please select a model, configure options, and click "Load Model"</pre>
</body>

</html>
